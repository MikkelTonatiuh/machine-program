<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Machine Program</title>
<meta name="description" content="A guided workout player for a 7-day machine program: a 3D figure shows each exercise with the working muscles lit, and you log your sets as you go.">
<meta name="theme-color" content="#0a0e11">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Machine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@87.5..100,400..500&family=Newsreader:ital,opsz,wght@0,6..72,300..400;1,6..72,300&display=swap" crossorigin>
<style>
:root { color-scheme: dark; --ink: #ece7de; --ink2: #aeb5b8; --ink3: #818b90; --amber: #e0a060; --ember: #c4511f;
  --line: rgba(236,231,222,.12); --line2: rgba(236,231,222,.26); --gut: 20px; --ease: cubic-bezier(.2,0,0,1);
  --sl: max(var(--gut), env(safe-area-inset-left, 0px)); --sr: max(var(--gut), env(safe-area-inset-right, 0px));
  --serif: Newsreader, "Iowan Old Style", Georgia, serif; --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --top: 59px; --arc: 522px; --ty0: 588px; --tx0: 0px; --tx1: 390px; --bx0: 0px; --bw: 390px; --fy: 291px; --fh: 463px; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; background: linear-gradient(#0a0d10 50%, #111 50%); overflow: hidden; overscroll-behavior: none; }
body { height: 100%; margin: 0; overflow: hidden; background: #111; color: var(--ink); font: 400 15px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app { position: relative; height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.stagebox { position: absolute; inset: 0; touch-action: pinch-zoom; cursor: grab; }
.stagebox:active { cursor: grabbing; }
.app.adjusting .stagebox { cursor: ns-resize; }
.stage { position: absolute; inset: 0; }
.stage .mce-stage { transition: opacity .4s var(--ease); }
.stagebox.is-booting .mce-stage { opacity: 0; }
.stage.is-still { background: radial-gradient(160% 70% at 50% 118%, #171717 57%, #c14d21 57.4%, #a88775 58.4%, #597c8a 62%, #183443 70%, #101618 84%); }
.stagebox.is-loading .mce-gl { visibility: hidden; }
.stagebox.nofig .mce-gl { opacity: 0; }
.soon, .loading { position: absolute; left: var(--bx0); width: var(--bw); top: var(--fy); transform: translateY(-50%); z-index: 2; margin: 0;
  padding-inline: var(--sl) var(--sr); text-align: center; font: italic 300 18px/1.3 var(--serif); color: var(--ink2); pointer-events: none; }
.loading { opacity: 0; visibility: hidden; transition: opacity .3s var(--ease), visibility 0s linear .3s; }
.stagebox.is-booting .loading, .stagebox.is-loading .loading { opacity: 1; visibility: visible; transition: opacity .7s var(--ease) .35s, visibility 0s; }
.top { position: absolute; left: 0; right: 0; top: 0; z-index: 4; padding: 0 var(--sr) 0 var(--sl); pointer-events: none; }
.segs { display: flex; gap: 4px; height: 26px; pointer-events: auto; }
.seg { position: relative; flex: 1 1 0; min-width: 0; height: 26px; }
.seg::before, .seg i { content: ""; position: absolute; left: 0; top: 11px; height: 2px; border-radius: 1px; }
.seg::before { right: 0; background: rgba(236,231,222,.17); transition: background-color .3s var(--ease); }
.seg[aria-current="step"]::before { background: rgba(236,231,222,.32); }
.seg i { width: calc(var(--f, 0) * 100%); background: rgba(236,231,222,.9); transition: width .45s var(--ease); }
.seg:focus-visible { outline-offset: -2px; border-radius: 4px; }
.bar { display: flex; align-items: center; justify-content: space-between; height: 36px; margin-top: -2px; }
.daybtn { pointer-events: auto; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 10px 0 0; font: 500 13px/1 var(--sans); color: var(--ink2); letter-spacing: .01em; }
.daybtn svg, .resetview svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
.resetview { pointer-events: auto; width: 36px; height: 36px; margin-right: -9px; display: grid; place-items: center; color: var(--ink2); }
.resetview svg { width: 17px; height: 17px; stroke-width: 1.5; }
.turntip { margin: 0; font: 400 12.5px/1 var(--sans); color: var(--ink3); letter-spacing: .01em; white-space: nowrap; }
@media (hover: hover) { .daybtn:hover, .resetview:hover { color: var(--ink); } }
.info { position: absolute; left: 0; right: 0; top: var(--ty0); z-index: 2; display: flex; flex-direction: column; align-items: center;
  padding: 0 var(--sr) 0 var(--sl); text-align: center; pointer-events: none; }
.info > * { margin: 0; max-width: 34rem; }
.kicker { font: 500 12.5px/1.2 var(--sans); color: var(--ink2); letter-spacing: .015em; margin-bottom: 4px; }
.kicker[data-tone="warm"] { color: var(--amber); }
.name { max-width: 100%; font: 300 clamp(31px, 8.7vw, 44px)/1.06 var(--serif); letter-spacing: -.012em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ncheck svg { width: .6em; height: .6em; margin: 0 .2em 0 -.1em; vertical-align: -.02em; fill: none; stroke: var(--amber); stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.clock { font: 300 clamp(62px, 18.5vw, 88px)/1 var(--serif); letter-spacing: -.02em; font-variant-numeric: tabular-nums lining-nums; }
.line { margin-top: 11px; font: 400 14.5px/1.3 var(--sans); color: var(--ink2); font-variant-numeric: tabular-nums; }
.line[data-tone="go"] { color: var(--amber); font-weight: 500; }
.ticks { display: inline-flex; gap: 4px; margin: 0 4px 0 10px; vertical-align: middle; position: relative; top: -1px; }
.ticks i { display: block; width: 12px; height: 3px; border-radius: 2px; background: rgba(236,231,222,.2); }
.ticks i.on { background: rgba(236,231,222,.86); }
.ticks i.cur { background: rgba(236,231,222,.42); }
.ticks i.go { background: var(--amber); box-shadow: 0 0 9px 1px rgba(255,140,60,.5); }
.ticks i.glow { animation: glow 1.6s var(--ease) both; }
@keyframes glow { 0%, 40% { background: #ffcf9e; box-shadow: 0 0 12px 3px rgba(255,108,40,.9); } 100% { background: rgba(236,231,222,.86); box-shadow: 0 0 0 0 rgba(255,108,40,0); } }
.mus { margin-top: 5px; font: 400 13.5px/1.3 var(--sans); color: var(--ink3); }
.app[data-view="rest"] .line { margin-top: 8px; }
.app[data-view="rest"] .clock { font-size: clamp(56px, 18.5vw, 76px); }
.app[data-view="rest"] .kicker { margin-bottom: 3px; }
.act { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; flex-direction: column; align-items: center;
  padding: 0 var(--sr) 12px var(--sl); pointer-events: none; }
.note { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; column-gap: 8px; max-width: min(100%, 30rem); min-height: 21px; margin: 0 0 8px;
  font: 400 14.5px/1.4 var(--sans); color: var(--ink2); text-align: center; text-wrap: balance; font-variant-numeric: tabular-nums; }
.note[data-tone="guide"], .note[data-tone="soft"], .note[data-tone="tip"] { font: italic 300 16.5px/1.3 var(--serif); color: #cfd2cf; }
.note[data-tone="soft"] { color: var(--ink3); }
.note[data-tone="tip"] { color: var(--ink2); }
.note[data-tone="done"] { color: var(--ink); }
.nicon { display: inline-flex; align-self: center; }
.nicon svg { width: 16px; height: 16px; fill: none; stroke: var(--amber); stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.undo { position: relative; pointer-events: auto; padding: 0 2px; font: 500 14.5px/1.4 var(--sans); color: var(--amber); }
.undo::after { content: ""; position: absolute; inset: -12px -14px; }
.sel { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 0 0 10px; pointer-events: auto; touch-action: manipulation; }
.stepbtn { width: 48px; height: 48px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--ink); border: 1px solid rgba(236,231,222,.28);
  transition: background-color .15s var(--ease), border-color .15s var(--ease), opacity .15s var(--ease); }
.stepbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
.stepbtn:active { background: rgba(236,231,222,.16); }
.stepbtn[aria-disabled="true"] { opacity: .3; cursor: default; }
.num { display: block; min-width: 118px; margin: 0; text-align: center; white-space: nowrap; font: 300 46px/48px var(--serif); color: var(--ink); font-variant-numeric: tabular-nums lining-nums; letter-spacing: -.01em; }
.num .n { display: inline-block; min-width: 1.05em; transform-origin: 50% 64%; transition: transform .18s var(--ease), color .2s var(--ease); }
.num .u { font: 400 13.5px/1 var(--sans); color: var(--ink3); letter-spacing: 0; }
.num.big .n { transform: scale(1.3); }
.num.bump .n { animation: bump .3s var(--ease); }
.num.big.bump .n { animation-name: bumpbig; }
@keyframes bump { from { transform: scale(1.32); } to { transform: scale(1); } }
@keyframes bumpbig { from { transform: scale(1.46); } to { transform: scale(1.3); } }
.primary { position: relative; display: flex; align-items: center; justify-content: center; gap: 9px; width: min(100%, 360px); height: 56px; flex: none;
  pointer-events: auto; touch-action: manipulation; border-radius: 999px; border: 1px solid rgba(236,231,222,.36); background: rgba(236,231,222,.08);
  color: var(--ink); font: 500 16.5px/1 var(--sans); letter-spacing: .01em; white-space: nowrap;
  transition: background-color .2s var(--ease), border-color .2s var(--ease), box-shadow .35s var(--ease), color .2s var(--ease); }
.pic { display: inline-flex; }
.primary[data-act="next"] .pic { order: 2; }
.pic svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.primary:active { background: rgba(236,231,222,.17); }
.primary[data-ack] { background: var(--ember); border-color: rgba(255,168,112,.6); color: #fff; box-shadow: 0 0 30px rgba(255,96,36,.42); cursor: default; }
.primary[data-ack] .pic svg { width: 27px; height: 27px; stroke-width: 2.3; }
@media (hover: hover) { .primary:not([data-ack]):hover { background: rgba(236,231,222,.13); border-color: rgba(236,231,222,.5); }
  .stepbtn:not([aria-disabled="true"]):hover { border-color: rgba(236,231,222,.55); } .undo:hover { color: #f2c08a; } }
.days { position: absolute; inset: 0; z-index: 9; display: flex; justify-content: center; background: #0b0d10; }
.dayswrap { display: flex; flex-direction: column; width: 100%; max-width: 460px; height: 100%; padding: 6px var(--sr) 18px var(--sl); }
.dayshead { display: flex; align-items: center; justify-content: space-between; min-height: 52px; }
.dayshead h2 { margin: 0; font: 500 13px/1 var(--sans); color: var(--ink2); letter-spacing: .015em; }
.daysclose { width: 44px; height: 44px; margin-right: -12px; display: grid; place-items: center; color: var(--ink2); }
.daysclose svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
.daylist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.dayrow { width: 100%; min-height: 60px; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: baseline; column-gap: 8px;
  padding: 15px 0 13px; border-bottom: 1px solid var(--line); text-align: left; }
.dayrow .n { font: 400 14px/1 var(--sans); color: var(--ink3); font-variant-numeric: tabular-nums; }
.dayrow .nm { font: 300 26px/1.05 var(--serif); color: var(--ink2); letter-spacing: -.01em; }
.dayrow .st { font: 400 13px/1 var(--sans); color: var(--ink3); white-space: nowrap; }
.dayrow[aria-current="true"] .nm { color: var(--ink); }
.dayrow[aria-current="true"] .n { color: var(--amber); }
.dayrow:focus-visible { outline-offset: -2px; border-radius: 8px; }
@media (hover: hover) { .dayrow:hover .nm { color: var(--ink); } }
.savenote { margin: auto 0 0; padding-top: 16px; font: 400 12.5px/1.4 var(--sans); color: var(--ink3); }
.app.side .info { left: var(--tx0); right: 0; top: var(--top); bottom: calc(var(--actb, 14px) + 112px); justify-content: flex-end; justify-content: safe flex-end; align-items: flex-start; text-align: left; padding: 0 var(--sr) 0 12px; }
.app.side[data-view="set"] .info { bottom: calc(var(--actb, 14px) + 176px); }
.app.side .name { font-size: clamp(28px, 4.3vw, 54px); }
.app.side .clock { font-size: clamp(56px, 8.5vw, 104px); }
.app.side .info > * { max-width: 30rem; }
.app.side .act { left: var(--tx0); bottom: var(--actb, 14px); align-items: flex-start; padding: 0 var(--sr) 0 12px; }
.app.side .note, .app.side .sel, .app.side .primary { width: min(100%, 340px); max-width: none; }
.app.side .num .u { color: var(--ink2); }
.app.side .dayswrap { max-width: 640px; }
.app.side .daylist { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; }
.app.side .dayrow { min-height: 48px; padding: 11px 0 9px; }
.app.side .dayrow .nm { font-size: 22px; }
@media (min-width: 1000px) and (min-height: 600px) {
  .app.side .line { font-size: 17px; margin-top: 14px; } .app.side .mus { font-size: 15.5px; } .app.side .kicker { font-size: 14px; }
  .app.side .note { font-size: 15.5px; } .app.side .note[data-tone="guide"], .app.side .note[data-tone="soft"], .app.side .note[data-tone="tip"] { font-size: 18px; }
}
@media (max-height: 699px) {
  .app:not(.side) .mus { display: none; }
  .app:not(.side) .note { margin-bottom: 5px; }
  .app:not(.side) .note[data-tone="guide"], .app:not(.side) .note[data-tone="soft"], .app:not(.side) .note[data-tone="tip"] { font-size: 15.5px; line-height: 1.22; }
  .app:not(.side) .sel { margin-bottom: 8px; }
}
@media (max-height: 419px) { .app.side .mus { display: none; } }
.app.longnote:not(.side) .mus { display: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .num.big .n { transform: none; } .num.big .n, .num.bump .n { color: var(--amber); }
  .ticks i.glow { background: #ffcf9e; box-shadow: 0 0 12px 3px rgba(255,108,40,.85); }
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html:has(.app.dlg) { background: #0b0d10 !important; }
.credit { margin: 0; padding-top: 4px; font: 400 12px/1.4 var(--sans); color: var(--ink3); opacity: .82; }
.savenote[hidden] + .credit { margin-top: auto; padding-top: 16px; }
</style>
</head>
<body>
<main class="app" id="app" data-mode="boot">
  <div class="stagebox is-booting" id="stagebox">
    <div class="stage" id="stage" role="img" aria-label="Exercise animation" aria-busy="true"></div>
    <p class="loading" id="loading">Loading the animation</p>
    <p class="soon" id="soon" hidden></p>
  </div>
  <header class="top" id="top" hidden>
    <nav class="segs" id="segs" aria-label="Today's steps"></nav>
    <div class="bar">
      <button class="daybtn" id="daybtn" type="button" aria-haspopup="dialog"><span id="daylabel"></span><svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="m2.5 4.5 3.5 3.5 3.5-3.5"/></svg></button>
      <p class="turntip" id="turntip" hidden>Drag sideways to turn</p>
      <button class="resetview" id="resetview" type="button" aria-label="Reset the view" hidden><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4.2 8.2A6 6 0 1 1 4 11.6"/><path d="M3.6 4.2v4.2h4.2"/></svg></button>
    </div>
  </header>
  <section class="info" id="info" aria-label="Now">
    <p class="kicker" id="kicker" hidden></p>
    <h1 class="name" id="name"></h1>
    <p class="clock" id="clock" hidden></p>
    <p class="line" id="line"></p>
    <p class="mus" id="mus" hidden></p>
  </section>
  <section class="act" id="act" aria-label="Actions" hidden>
    <p class="note" id="note" hidden><span class="nicon" id="nicon" aria-hidden="true" hidden><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="m4.4 10.6 3.7 3.6 7.6-8.4"/></svg></span><span id="notet"></span><button class="undo" id="undo" type="button" hidden>Undo</button></p>
    <div class="sel" id="sel" role="group" aria-label="Reps for this set" hidden>
      <button class="stepbtn" id="minus" type="button" aria-label="One rep fewer"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4.5 10h11"/></svg></button>
      <output class="num" id="reps" aria-live="polite"><span class="n" id="repsn"></span> <span class="u">reps</span></output>
      <button class="stepbtn" id="plus" type="button" aria-label="One rep more"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4.5 10h11M10 4.5v11"/></svg></button>
    </div>
    <button class="primary" id="primary" type="button" hidden><span class="pic" id="pic" aria-hidden="true"></span><span id="plabel"></span></button>
  </section>
  <div class="days" id="days" role="dialog" aria-modal="true" aria-labelledby="daystitle" hidden>
    <div class="dayswrap">
      <div class="dayshead"><h2 id="daystitle">Choose a day</h2><button class="daysclose" id="daysclose" type="button" aria-label="Close"><svg viewBox="0 0 14 14" aria-hidden="true" focusable="false"><path d="m2.5 2.5 9 9m0-9-9 9"/></svg></button></div>
      <ol class="daylist" id="daylist"></ol>
      <p class="savenote" id="savenote" hidden>Saved on this phone</p>
      <p class="credit">Based on Jeff Nippard&rsquo;s public training advice. Not affiliated.</p>
    </div>
  </div>
  <p class="sr" id="status" aria-live="polite"></p>
